[project]
name = "aegis"
version = "0.1.0"
description = "Aegis: Agentic IT Operations & Autonomous Incident Resolution Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
ai = [
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "chromadb>=0.4.24",
]
needle = [
    "cactus-needle>=0.1.0",
]
typesafe = [
    "typesafe>=0.1.0",
]
dev = [
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
